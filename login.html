<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AgendaCar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <header>
        <a href="index.html" class="Logo"><img src="img/HLogo.png" alt="Logo AgendaCar"></a>
    </header>

    <main style="max-width: 450px; margin: 80px auto; width: 100%; padding: 0 20px;">
        <div class="card-flat" style="text-align: center;">
            <h2 style="color: var(--primary-blue); margin-bottom: 10px;">Bem-vindo de volta!</h2>
            <p style="color: var(--text-light); margin-bottom: 30px;">Acesse sua conta para continuar.</p>

            <form id="form-login">
                <div id="error-msg"
                    style="display: none; color: #d93025; background: #ffeaea; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-weight: bold;">
                </div>

                <div class="form-group">
                    <label>E-mail</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Senha</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">ENTRAR</button>
            </form>
            <p style="margin-top: 20px; font-size: 14px;">Novo por aqui? <a href="cadastro.html"
                    style="color: var(--primary-blue); font-weight: bold;">Crie sua conta</a></p>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Captura o email vindo do redirecionamento do cadastro[cite: 7]
            const urlParams = new URLSearchParams(window.location.search);
            const emailPreenchido = urlParams.get('email');

            if (emailPreenchido) {
                document.getElementById('email').value = emailPreenchido;
                document.getElementById('password').focus();
            }
        });

        document.getElementById('form-login').addEventListener('submit', function (event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('error-msg');

            const usuarios = JSON.parse(localStorage.getItem('agendacar_usuarios')) || [];
            const usuarioValido = usuarios.find(user => user.email === email && user.senha === password);

            if (usuarioValido) {
                localStorage.setItem('agendacar_sessao', JSON.stringify({
                    id: usuarioValido.id, nome: usuarioValido.nome, email: usuarioValido.email, tipo: usuarioValido.tipo
                }));
                window.location.href = 'home.html';
            } else {
                errorMsg.textContent = 'Acesso negado. Verifique e-mail ou senha.';
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>

</html>
