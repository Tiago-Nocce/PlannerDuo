<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - AgendaCar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <header>
        <a href="index.html" class="Logo"><img src="img/HLogo.png" alt="Logo AgendaCar"></a>
        <button class="btn-primary" onclick="window.location.href='login.html'">Fazer Login</button>
    </header>

    <main style="max-width: 900px; margin: 40px auto; width: 100%; padding: 0 20px;">
        <div class="card-flat">
            <h2 style="margin-bottom: 20px; color: var(--primary-blue);">Crie sua conta</h2>
            <form id="form-cadastro" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <!-- Coluna 1 -->
                <div>
                    <div class="form-group">
                        <label>Tipo de Conta</label>
                        <select id="tipo_conta"
                            style="width: 100%; padding: 12px; border-radius: 8px; border: 2px solid #e2e8f0;">
                            <option value="cliente">Cliente (Busco serviços)</option>
                            <option value="prestador">Prestador (Ofereço serviços)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Nome Completo</label>
                        <div class="input-wrapper"><i class="fa-solid fa-user"></i><input type="text" id="nome_cad"
                                required></div>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <div class="input-wrapper"><i class="fa-solid fa-envelope"></i><input type="email"
                                id="email_cad" required></div>
                    </div>
                </div>
                <!-- Coluna 2 -->
                <div>
                    <div class="form-group">
                        <label>Celular</label>
                        <div class="input-wrapper"><i class="fa-solid fa-phone"></i><input type="text" id="celular_cad"
                                required></div>
                    </div>
                    <div class="form-group">
                        <label>Senha</label>
                        <div class="input-wrapper"><i class="fa-solid fa-lock"></i><input type="password" id="senha_cad"
                                required></div>
                    </div>
                </div>

                <div style="grid-column: span 2; text-align: center;">
                    <div id="msg-feedback"
                        style="display: none; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-weight: bold;">
                    </div>
                    <button type="submit" class="btn-primary" style="width: 50%;">Finalizar Cadastro</button>
                </div>
            </form>
        </div>
    </main>

    <script>
        document.getElementById('form-cadastro').addEventListener('submit', function (event) {
            event.preventDefault();

            const nome = document.getElementById('nome_cad').value.trim();
            const email = document.getElementById('email_cad').value.trim().toLowerCase();
            const celular = document.getElementById('celular_cad').value.trim();
            const senha = document.getElementById('senha_cad').value.trim();
            const tipoConta = document.getElementById('tipo_conta').value;

            const feedback = document.getElementById('msg-feedback');
            let usuarios = JSON.parse(localStorage.getItem('agendacar_usuarios')) || [];

            if (usuarios.some(u => u.email === email)) {
                feedback.textContent = 'Este e-mail já está em uso. Tente fazer login.';
                feedback.style.color = '#d93025'; feedback.style.backgroundColor = '#ffeaea';
                feedback.style.display = 'block';
                return;
            }

            usuarios.push({ id: crypto.randomUUID(), nome, email, celular, senha, tipo: tipoConta });
            localStorage.setItem('agendacar_usuarios', JSON.stringify(usuarios));

            feedback.textContent = 'Cadastro realizado com sucesso! Redirecionando...';
            feedback.style.color = '#10b981'; feedback.style.backgroundColor = '#d1fae5';
            feedback.style.display = 'block';

            // Redireciona passando o email preenchido[cite: 2]
            setTimeout(() => {
                window.location.href = `login.html?email=${encodeURIComponent(email)}`;
            }, 1500);
        });
    </script>
</body>

</html>
